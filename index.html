<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Mayorista</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>D</text></svg>">

  <!-- Tipografías: Playfair Display (títulos) e Inter (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body>

  <!-- ========== ENCABEZADO ========== -->
  <header class="encabezado">
    <h1>Catálogo Mayorista</h1>
    <p>Compra mínima: 50 unidades por producto</p>
  </header>

  <!-- ========== CONTENIDO PRINCIPAL ========== -->
  <main>

    <!-- Buscador -->
    <section class="buscador">
      <label for="campo-busqueda">Buscar producto</label>
      <input type="search" id="campo-busqueda" placeholder="Ej: Sauvage, Afnan, 100ml...">
    </section>

    <!-- Lista de productos -->
    <section class="catalogo">
      <h2>Productos</h2>
      <p id="contador-resultados">Cargando productos...</p>

      <div id="lista-productos" class="lista-productos">

      </div>

      <button type="button" id="boton-ver-mas" class="boton-ver-mas">Ver más productos</button>
    </section>

  </main>

  <!-- ========== BARRA FIJA (celular) ========== -->
  <button type="button" id="barra-pedido" class="barra-pedido">
    <span id="barra-resumen">Tu pedido está vacío</span>
    <span>Ver pedido</span>
  </button>

  <!-- ========== PANEL DEL PEDIDO ========== -->
  <aside id="panel-pedido" class="panel-pedido">
    <div class="panel-encabezado">
      <h2>Tu pedido</h2>
      <button type="button" id="boton-cerrar-pedido" class="boton-cerrar" aria-label="Cerrar pedido">✕</button>
    </div>

    <p id="pedido-vacio" class="pedido-vacio">Todavía no agregaste productos.</p>

    <ul id="lista-pedido" class="lista-pedido">
    </ul>

    <div class="totales">
      <p>Total de unidades: <strong id="total-unidades">0</strong></p>
      <p>Total: <strong id="total-pesos">$ 0,00</strong></p>
    </div>

    <button type="button" id="boton-enviar" class="boton-enviar" disabled>Enviar pedido por WhatsApp</button>
  </aside>

</body>
</html>
